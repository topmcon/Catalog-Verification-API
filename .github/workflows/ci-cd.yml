name: CI Pipeline

# ⚠️ AUTO-DEPLOY REMOVED (2026-06-10, Finding #079 / PLATFORM-AUDIT Phase 4).
#
# The former `deploy-production` job SSH'd into prod on every push to main and ran:
#   rsync -avz --delete ./ root@verify.cxc-ai.com:/opt/catalog-verification-api/
#   npm install --production && systemctl restart catalog-verification.service
#
# That silently fought every documented manual operation for months:
#   - `npm install --production` PRUNED devDependencies after each push — the true root
#     cause of the recurring "tsc not found / @types missing on prod" failures (OVS-03)
#   - `systemctl restart` fired on every push — killed in-flight verification/audit jobs
#     (observed during Finding #078 confirm runs)
#   - `rsync --delete` overwrote the prod working tree outside git (phantom "local
#     changes") and DELETED untracked server files — including database backups
#
# Deployment policy (CLAUDE.md): MANUAL ONLY —
#   ssh mardeys-prod "cd /opt/catalog-verification-api && git pull origin main && \
#     npm install --include=dev && npm run build && systemctl restart catalog-verification"
# gated by scripts/pre-deploy-validate-all.sh.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate picklist sync
        run: node scripts/validate-picklist-sync.js

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
